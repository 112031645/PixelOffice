# ============================================================
# Higress 云原生 API 网关配置
# 文档：https://higress.io/
# 部署 Higress 后应用此 Gateway 路由配置
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-gateway
  namespace: cloud
  annotations:
    # 启用 Higress
    higress.io/resource-definer: higress
spec:
  ingressClassName: higress
  rules:
    # 用户服务路由
    - host: cloud.example.com
      http:
        paths:
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: cloud-user-service
                port:
                  number: 8081
    # 订单服务路由
    - host: cloud.example.com
      http:
        paths:
          - path: /order
            pathType: Prefix
            backend:
              service:
                name: cloud-order-service
                port:
                  number: 8082
---
# Higress 跨域配置（Wasm 插件）
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: cloud-cors
  namespace: higress-system
spec:
  priority: 100
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: higress
  config:
    allow_origin: "*"
    allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
    allow_headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"

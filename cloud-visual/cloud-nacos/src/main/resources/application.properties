# ============================================================================
# cloud-nacos —— Nacos Server 2.3.0 启动项配置
# 控制台地址: http://127.0.0.1:8848/nacos
# 单机模式(standalone)默认使用内嵌 Derby 数据库，无需额外安装 MySQL
# ============================================================================

#*************** Spring Boot Related Configurations ***************#
### 应用名（仅用于日志/指标标识，Nacos 本身不依赖它）
spring.application.name=cloud-nacos
### 默认 web 上下文路径
server.servlet.contextPath=/nacos
### 错误信息中带上 message 字段（控制台需要）
server.error.include-message=ALWAYS
### 默认 web 端口（gRPC 端口 = 8848 + 1000 = 9848，由 Nacos 自动推导）
server.port=8848

#*************** Network Related Configurations ***************#
### 集群模式下是否在 cluster.conf 中使用 hostname 而不是 ip
# nacos.inetutils.prefer-hostname-over-ip=false

### 指定本机 IP
# nacos.inetutils.ip-address=

#*************** Config Module Related Configurations ***************#
### 单机模式使用内嵌 Derby，以下 MySQL 配置默认全部注释；
### 若需切换为外置 MySQL，请解开注释并执行 sql/nacos-mysql.sql 建库建表
# spring.sql.init.platform=mysql
# db.num=1
# db.url.0=jdbc:mysql://127.0.0.1:3306/nacos?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# db.user.0=nacos
# db.password.0=nacos

### 数据源插件 SQL 日志开关（打印 Mapper 生成的 SQL）
### 注意：Nacos 2.3.0 的 MapperProxy.createSingleProxy 存在 ClassCastException 缺陷
### （SINGLE_MAPPER_PROXY_MAP 被声明为 Map<String, MapperProxy>，动态代理对象无法强转为 MapperProxy），
### 开启后启动即报 `jdk.proxy2.$ProxyN cannot be cast to com.alibaba.nacos.plugin.datasource.proxy.MapperProxy`，
### 该问题在 Nacos 2.5.x 才被修复，因此 2.3.0 必须保持 false。
nacos.plugin.datasource.log.enabled=false

### 配置推送最大重试次数
nacos.config.push.maxRetryTime=50

#*************** Naming Module Related Configurations ***************#
### 是否开启数据预热
# nacos.naming.data.warmup=true

### 实例是否自动过期（相当于健康检查）
# nacos.naming.expireInstance=true

### 空服务自动清理
nacos.naming.empty-service.auto-clean=true
nacos.naming.empty-service.clean.initial-delay-ms=50000
nacos.naming.empty-service.clean.period-time-ms=30000

#*************** Metrics / Actuator ***************#
### 暴露的监控端点（Prometheus 抓取 /actuator/prometheus）
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.export.elastic.enabled=false
management.metrics.export.influx.enabled=false

#*************** Access Log Related Configurations ***************#
### 访问日志开关（启动类中已通过 System.setProperty 强制关闭，避免污染工作目录）
server.tomcat.accesslog.enabled=false
server.tomcat.accesslog.max-days=30
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D %{User-Agent}i %{Request-Source}i
server.tomcat.basedir=file:.

#*************** Access Control Related Configurations ***************#
### 免鉴权路径（Nacos 1.2.0 起已废弃，仅为兼容保留）
nacos.security.ignore.urls=/,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-ui/public/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**

### 鉴权体系，目前只支持 'nacos' 和 'ldap'
nacos.core.auth.system.type=nacos

### 是否开启鉴权：
###   false —— 控制台免登录，开箱即用（当前为本地开发环境，默认关闭）
###   true  —— 控制台需要登录，默认账号/密码为 nacos/nacos
nacos.core.auth.enabled=false

### 鉴权信息本地缓存开关（开启后鉴权变更约有 15 秒延迟）
nacos.core.auth.caching.enabled=true

### 1.4.1 起为 user-agent: nacos-server 放行（仅用于老版本升级）
nacos.core.auth.enable.userAgentAuthWhite=false

### 服务端之间请求的身份标识（nacos.core.auth.enabled=true 时必须设置）
nacos.core.auth.server.identity.key=cloud-framework-nacos-key
nacos.core.auth.server.identity.value=cloud-framework-nacos-value

### token 有效期（秒）
nacos.core.auth.plugin.nacos.token.cache.enable=false
nacos.core.auth.plugin.nacos.token.expire.seconds=18000
### token 密钥，必须为 Base64 字符串且原始长度不小于 32 字节（Nacos 2.2.1+ 强校验，生产环境务必修改）
nacos.core.auth.plugin.nacos.token.secret.key=SecretKey012345678901234567890123456789012345678901234567890123456789

### LDAP 鉴权（nacos.core.auth.system.type=ldap 时生效），{0} 为登录用户名占位符
# nacos.core.auth.ldap.url=ldap://localhost:389
# nacos.core.auth.ldap.basedc=dc=example,dc=org
# nacos.core.auth.ldap.userDn=cn=admin,${nacos.core.auth.ldap.basedc}
# nacos.core.auth.ldap.password=admin
# nacos.core.auth.ldap.userdn=cn={0},dc=example,dc=org

#*************** Control Plugin Related Configurations ***************#
# nacos.plugin.control.manager.type=nacos
# nacos.plugin.control.rule.local.basedir=${nacos.home}
# nacos.plugin.control.rule.external.storage=

